[project]
name = "trackside-agent"
version = "0.1.0"
description = "Read-only alert triage agent for Trackside"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11,<3",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trackside-agent = "trackside_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackside_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
