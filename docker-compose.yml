# Local stack. Credentials here are for local development only.
name: trackside

x-database-url: &database-url postgres://trackside:${POSTGRES_PASSWORD:-trackside}@db:5432/trackside
# The API reaches Postgres through Toxiproxy, so fault scenarios can slow or cut
# that link without touching application code. Pass-through when no fault is set.
x-api-database-url: &api-database-url postgres://trackside:${POSTGRES_PASSWORD:-trackside}@toxiproxy:5433/trackside

# Shared by every Airflow service. LocalExecutor: no Celery or Redis for one machine.
x-airflow: &airflow
  build:
    context: .
    dockerfile: pipelines/Dockerfile.airflow
  image: trackside-airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-trackside-local-only}
    # Local only: every visitor is an admin. Real auth is needed before this leaves localhost.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    DATABASE_URL: *database-url
    RAW_DATA_DIR: /data/raw
    PUSHGATEWAY_URL: pushgateway:9091
    TIMING_SEASONS: ${TIMING_SEASONS:-2024,2025,2026}
    SEASON: ${SEASON:-2027}
  volumes:
    - raw-data:/data/raw
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
    seed:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trackside
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackside}
      POSTGRES_DB: trackside
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackside -d trackside"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: migrates, scrapes the calendar, generates stays. Rerun with
  # `docker compose run --rm seed` to refresh the calendar and add today's prices.
  seed:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    environment:
      DATABASE_URL: *database-url
      SEASON: ${SEASON:-2027}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-readonly}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    environment:
      DATABASE_URL: *api-database-url
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  airflow-db:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot: migrates Airflow's metadata database and hands volumes to the airflow user.
  airflow-init:
    <<: *airflow
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chown -R 50000:0 /data/raw /opt/airflow/logs
        exec /entrypoint airflow db migrate
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Airflow emits StatsD; this re-exposes it for Prometheus.
  statsd-exporter:
    image: prom/statsd-exporter:v0.29.0
    command: --statsd.mapping-config=/etc/statsd/mapping.yml
    volumes:
      - ./observability/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    restart: unless-stopped

  # Batch jobs push their outcome here for Prometheus to scrape.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    # Without a file, a restart forgets every pipeline's last success, and
    # PipelineStale goes quiet instead of firing.
    command: ["--persistence.file=/pushgateway/metrics.db", "--persistence.interval=1m"]
    volumes:
      - pushgateway-data:/pushgateway

  # Fault injection between the API and Postgres. Its control API is bound to
  # localhost for the fault scripts (faults/inject.py).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./observability/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # Investigates each alert with read-only tools; files a GitHub issue and a
  # Discord message when their credentials are set in .env.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      DATABASE_URL: *database-url
      READONLY_DATABASE_URL: postgres://trackside_readonly:${READONLY_DB_PASSWORD:-readonly}@db:5432/trackside
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MONTHLY_BUDGET_USD: ${AGENT_MONTHLY_BUDGET_USD:-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      # Mounted so runbook edits reach the agent without a rebuild.
      - ./docs/runbooks:/app/docs/runbooks:ro
      - agent-outbox:/outbox
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Ships every container's stdout to Loki, labelled by Compose service.
  alloy:
    image: grafana/alloy:v1.5.0
    command: run /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Read-only anonymous access so dashboards can be linked without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-trackside}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  airflow-db-data:
  airflow-logs:
  # Private copies of downloaded timing files. Never committed or served.
  raw-data:
  prometheus-data:
  pushgateway-data:
  loki-data:
  alertmanager-data:
  # Markdown copy of every incident report.
  agent-outbox:
