# Turn Airflow's dotted StatsD names into labelled Prometheus metrics.
mappings:
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.dagrun.duration.*.*"
    name: "airflow_dagrun_duration_seconds"
    observer_type: summary
    labels:
      state: "$1"
      dag_id: "$2"

  - match: "airflow.dag_processing.import_errors"
    name: "airflow_dag_import_errors"

  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat_total"

  - match: "airflow.ti_failures"
    name: "airflow_ti_failures_total"

  - match: "airflow.ti_successes"
    name: "airflow_ti_successes_total"

  # Everything else is dropped to keep cardinality down.
  - match: "."
    match_type: regex
    action: drop
    name: "dropped"
