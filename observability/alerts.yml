# Alert rules. Alertmanager routes every alert to the triage agent
# (observability/alertmanager.yml); each names the runbook the agent starts from.
groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The Trackside API is not answering scrapes.
          runbook: docs/runbooks/api.md

      - alert: ApiHighErrorRatio
        expr: |
          sum(rate(http_requests_total{job="api", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: More than 5% of API requests are failing with a server error.
          runbook: docs/runbooks/api.md

      - alert: ApiSlowRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="api", route=~"GET /api/.*"}[5m]))
          ) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: API p95 latency has been above 500 ms for 10 minutes.
          runbook: docs/runbooks/api.md

  - name: pipelines
    rules:
      # Both pipelines run daily, so 30 hours means a whole run was missed or failed.
      - alert: PipelineStale
        expr: time() - trackside_pipeline_last_success_timestamp_seconds > 30 * 3600
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} has not succeeded for {{ $value | humanizeDuration }}."
          runbook: docs/runbooks/pipeline-stale.md

      # PipelineStale needs a timestamp to compare against. If the series is gone
      # (never pushed, or the Pushgateway lost it), say so rather than stay quiet.
      - alert: PipelineMetricsMissing
        expr: |
          absent(trackside_pipeline_last_success_timestamp_seconds{pipeline="calendar_and_stays"})
          or absent(trackside_pipeline_last_success_timestamp_seconds{pipeline="timing_archive"})
        for: 2h
        labels:
          severity: ticket
        annotations:
          summary: "Pipeline {{ $labels.pipeline }} has no last-success metric, so staleness cannot be judged."
          runbook: docs/runbooks/pipeline-stale.md

      - alert: DataQualityCheckFailing
        expr: trackside_dq_check_status == 2
        labels:
          severity: ticket
        annotations:
          summary: "Data-quality check {{ $labels.check }} is failing for {{ $labels.pipeline }}."
          runbook: docs/runbooks/data-quality.md

      - alert: AirflowTaskFailures
        expr: increase(airflow_ti_failures_total[1h]) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Airflow task instances failed in the last hour."
          runbook: docs/runbooks/pipeline-stale.md

      - alert: AirflowSchedulerDown
        expr: rate(airflow_scheduler_heartbeat_total[5m]) == 0 or absent(airflow_scheduler_heartbeat_total)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The Airflow scheduler has stopped heartbeating, so no pipeline will run.
          runbook: docs/runbooks/pipeline-stale.md

      - alert: AirflowDagImportErrors
        expr: airflow_dag_import_errors > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} DAG files fail to import, so their pipelines will not run."
          runbook: docs/runbooks/pipeline-stale.md

  - name: triage
    rules:
      # The agent cannot triage its own outage: Alertmanager's delivery to it
      # fails too. This shows on Prometheus' Alerts page and in Alertmanager's UI.
      - alert: TriageAgentDown
        expr: up{job="agent"} == 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The triage agent is not answering scrapes, so alerts are not being triaged.
          runbook: docs/runbooks/triage-agent.md

      - alert: TriageAgentOverBudget
        expr: trackside_agent_month_spend_usd >= trackside_agent_month_budget_usd
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The triage agent has used its monthly API budget; incidents get evidence-only reports until next month.
          runbook: docs/runbooks/triage-agent.md
