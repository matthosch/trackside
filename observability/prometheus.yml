global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Batch outcomes pushed by the pipelines. Keep their own job and pipeline labels.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: airflow
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
